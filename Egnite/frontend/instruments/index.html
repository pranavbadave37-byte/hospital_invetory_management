<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Instrument Dashboard · MediCore</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="instruments-dashboard">
  <div id="app-shell">
    <div class="stat-grid" id="statGrid"></div>

    <div class="two-col">
      <div class="panel">
        <div class="panel-header">
          <div><h2>Currently Issued</h2><p>Instruments checked out and not yet returned</p></div>
          <a class="btn btn-outline btn-sm" href="/instruments/issue_return/index.html">View all</a>
        </div>
        <div class="panel-body no-pad" id="issuedTable"></div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <div><h2>Maintenance Queue</h2><p>Due, scheduled & in progress</p></div>
          <a class="btn btn-outline btn-sm" href="/instruments/instruments/index.html">Manage</a>
        </div>
        <div class="panel-body no-pad" id="maintTable"></div>
      </div>
    </div>
  </div>

<script src="/js/mock-data.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/common.js"></script>
<script src="/instruments/page.js"></script>
</body>
</html>
