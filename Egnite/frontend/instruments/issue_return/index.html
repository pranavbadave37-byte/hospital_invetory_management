<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Issue / Return · MediCore</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="instruments-issue_return">
  <div id="app-shell">
    <div class="stat-grid" id="statGrid"></div>

    <div class="panel">
      <div class="panel-header">
        <div>
          <h2>Instrument Issue / Return</h2>
          <p>Track instruments checked out to wards/departments and their return status</p>
        </div>
        <div class="toolbar">
          <div class="search-box">
            <span id="searchIconSlot"></span>
            <input type="text" id="searchInput" placeholder="Search instrument, department..." />
          </div>
          <select class="select-filter" id="statusFilter">
            <option value="">All statuses</option>
            <option>Issued</option>
            <option>Returned</option>
          </select>
          <button class="btn btn-primary btn-sm" id="addBtn">＋ Issue Instrument</button>
        </div>
      </div>
      <div class="panel-body no-pad" id="tableContainer"></div>
    </div>
  </div>

<script src="/js/mock-data.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/common.js"></script>
<script src="/instruments/issue_return/page.js"></script>
</body>
</html>
