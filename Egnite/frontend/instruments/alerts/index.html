<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Instrument Alerts · MediCore</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="instruments-alerts">
  <div id="app-shell">
    <div class="stat-grid" id="statGrid"></div>

    <div class="panel">
      <div class="panel-header">
        <div><h2>Maintenance Due</h2><p>Instruments needing service, in progress or scheduled</p></div>
      </div>
      <div class="panel-body no-pad" id="maintenanceTable"></div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div><h2>Overdue Returns</h2><p>Issued instruments past their expected return date</p></div>
      </div>
      <div class="panel-body no-pad" id="overdueTable"></div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div><h2>Damaged</h2><p>Instruments flagged damaged or returned in poor condition</p></div>
      </div>
      <div class="panel-body no-pad" id="damagedTable"></div>
    </div>
  </div>

<script src="/js/mock-data.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/common.js"></script>
<script src="/instruments/alerts/page.js"></script>
</body>
</html>
