<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Medicines · MediCore</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="pharmacy-medicines">
  <div id="app-shell">
    <div class="stat-grid" id="statGrid"></div>

    <div class="panel">
      <div class="panel-header">
        <div>
          <h2>Medicine Inventory</h2>
          <p>Stock levels, pricing & expiry</p>
        </div>
        <div class="toolbar">
          <div class="search-box">
            <span id="searchIconSlot"></span>
            <input type="text" id="searchInput" placeholder="Search medicine, category, manufacturer..." />
          </div>
          <select class="select-filter" id="categoryFilter"><option value="">All categories</option></select>
          <button class="btn btn-primary btn-sm" id="addBtn">＋ Add Medicine</button>
        </div>
      </div>
      <div class="panel-body no-pad" id="tableContainer"></div>
    </div>
  </div>

<script src="/js/mock-data.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/common.js"></script>
<script src="/pharmacy/medicines/page.js"></script>
</body>
</html>
