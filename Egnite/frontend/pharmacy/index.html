<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pharmacy Dashboard · MediCore</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="pharmacy-dashboard">
  <div id="app-shell">
    <div class="stat-grid" id="statGrid"></div>

    <div class="two-col">
      <div class="panel">
        <div class="panel-header">
          <div><h2>Attention Needed</h2><p>Low, expiring & expired medicines</p></div>
          <a class="btn btn-outline btn-sm" href="/pharmacy/alert/index.html">View all alerts</a>
        </div>
        <div class="panel-body no-pad" id="alertTable"></div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <div><h2>Recent Stock Transactions</h2><p>Latest stock in / stock out</p></div>
          <a class="btn btn-outline btn-sm" href="/pharmacy/stock/index.html">View stock</a>
        </div>
        <div class="panel-body no-pad" id="txTable"></div>
      </div>
    </div>
  </div>

<script src="/js/mock-data.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/common.js"></script>
<script src="/pharmacy/page.js"></script>
</body>
</html>
