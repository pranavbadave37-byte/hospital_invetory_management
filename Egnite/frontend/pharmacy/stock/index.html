<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock · MediCore</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="pharmacy-stock">
  <div id="app-shell">
    <div class="stat-grid" id="statGrid"></div>

    <div class="panel">
      <div class="panel-header">
        <div>
          <h2>Stock Transactions</h2>
          <p>Stock in / stock out history</p>
        </div>
        <div class="toolbar">
          <div class="search-box">
            <span id="searchIconSlot"></span>
            <input type="text" id="searchInput" placeholder="Search medicine..." />
          </div>
          <select class="select-filter" id="typeFilter">
            <option value="">All types</option>
            <option value="IN">Stock In</option>
            <option value="OUT">Stock Out</option>
          </select>
          <button class="btn btn-outline btn-sm" id="stockOutBtn">Stock Out</button>
          <button class="btn btn-primary btn-sm" id="stockInBtn">＋ Stock In</button>
        </div>
      </div>
      <div class="panel-body no-pad" id="tableContainer"></div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div>
          <h2>Suppliers</h2>
          <p>Registered medicine suppliers</p>
        </div>
        <button class="btn btn-outline btn-sm" id="addSupplierBtn">＋ Add Supplier</button>
      </div>
      <div class="panel-body no-pad" id="supplierTable"></div>
    </div>
  </div>

<script src="/js/mock-data.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/common.js"></script>
<script src="/pharmacy/stock/page.js"></script>
</body>
</html>
