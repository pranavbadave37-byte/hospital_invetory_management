<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pharmacy Alerts · MediCore</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="pharmacy-alert">
  <div id="app-shell">
    <div class="stat-grid" id="statGrid"></div>

    <div class="panel">
      <div class="panel-header">
        <div>
          <h2>Low &amp; Out of Stock</h2>
          <p>Medicines that need reordering</p>
        </div>
        <select class="select-filter" id="stockFilter">
          <option value="">All</option>
          <option value="Low Stock">Low Stock</option>
          <option value="Out of Stock">Out of Stock</option>
        </select>
      </div>
      <div class="panel-body no-pad" id="stockTable"></div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div>
          <h2>Expiring Soon</h2>
          <p>Medicines expiring within 60 days</p>
        </div>
      </div>
      <div class="panel-body no-pad" id="expiryTable"></div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div>
          <h2>Expired</h2>
          <p>Past expiry — remove from shelves immediately</p>
        </div>
      </div>
      <div class="panel-body no-pad" id="expiredTable"></div>
    </div>
  </div>

<script src="/js/mock-data.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/common.js"></script>
<script src="/pharmacy/alert/page.js"></script>
</body>
</html>
