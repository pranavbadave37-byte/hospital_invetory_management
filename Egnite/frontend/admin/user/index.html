<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>User Management · MediCore</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="admin-user">
  <div id="app-shell">
    <div class="stat-grid" id="statGrid"></div>

    <div class="panel">
      <div class="panel-header">
        <div>
          <h2>System Users</h2>
          <p>Accounts for Admin, Doctor, Pharmacy Head &amp; Instrument Head roles</p>
        </div>
        <div class="toolbar">
          <div class="search-box">
            <span id="searchIconSlot"></span>
            <input type="text" id="searchInput" placeholder="Search name, username..." />
          </div>
          <select class="select-filter" id="roleFilter">
            <option value="">All roles</option>
            <option value="admin">Admin</option>
            <option value="doctor">Doctor</option>
            <option value="pharmacy">Pharmacy Head</option>
            <option value="instrument">Instrument Head</option>
          </select>
          <button class="btn btn-primary btn-sm" id="addBtn">＋ Add User</button>
        </div>
      </div>
      <div class="panel-body no-pad" id="tableContainer"></div>
    </div>
  </div>

<script src="/js/mock-data.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/common.js"></script>
<script src="/admin/user/page.js"></script>
</body>
</html>
