<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard · MediCore</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="admin-dashboard">
  <div id="app-shell">
    <div class="stat-grid" id="statGrid"></div>

    <div class="two-col">
      <div class="panel">
        <div class="panel-header">
          <div><h2>System Alerts</h2><p>Things that need admin attention</p></div>
        </div>
        <div class="panel-body"><ul class="list-simple" id="alertList"></ul></div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <div><h2>Reports</h2><p>Snapshot across departments</p></div>
        </div>
        <div class="panel-body"><ul class="list-simple" id="reportList"></ul></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div><h2>Recent Access Activity</h2><p>Latest logins across all roles</p></div>
        <a class="btn btn-outline btn-sm" href="/admin/security/index.html">View Security</a>
      </div>
      <div class="panel-body no-pad" id="activityTable"></div>
    </div>
  </div>

<script src="/js/mock-data.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/common.js"></script>
<script src="/admin/page.js"></script>
</body>
</html>
