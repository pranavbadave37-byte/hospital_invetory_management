<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Consultations · MediCore</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="doctor-consultation">
  <div id="app-shell">
    <div class="stat-grid" id="statGrid"></div>

    <div class="panel">
      <div class="panel-header">
        <div>
          <h2>My Consultations</h2>
          <p>Symptoms, diagnosis, notes & prescriptions you've recorded</p>
        </div>
        <div class="toolbar">
          <div class="search-box">
            <span id="searchIconSlot"></span>
            <input type="text" id="searchInput" placeholder="Search patient, diagnosis..." />
          </div>
          <button class="btn btn-primary btn-sm" id="addBtn">＋ New Consultation</button>
        </div>
      </div>
      <div class="panel-body no-pad" id="tableContainer"></div>
    </div>
  </div>

<script src="/js/mock-data.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/common.js"></script>
<script src="/js/consultation-wizard.js"></script>
<script src="/doctor/consultation/page.js"></script>
</body>
</html>
