<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Patients · MediCore</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="doctor-patients">
  <div id="app-shell">
    <div class="stat-grid" id="statGrid"></div>

    <div class="panel">
      <div class="panel-header">
        <div>
          <h2>My Patients</h2>
          <p>Patients you have seen or have an appointment with</p>
        </div>
        <div class="toolbar">
          <div class="search-box">
            <span id="searchIconSlot"></span>
            <input type="text" id="searchInput" placeholder="Search by name, phone, blood group..." />
          </div>
          <select class="select-filter" id="genderFilter">
            <option value="">All genders</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
          <button class="btn btn-primary btn-sm" id="addBtn">＋ New Patient</button>
        </div>
      </div>
      <div class="panel-body no-pad" id="tableContainer"></div>
    </div>
  </div>

<script src="/js/mock-data.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/common.js"></script>
<script src="/doctor/patients/page.js"></script>
</body>
</html>
