<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Doctor Dashboard · MediCore</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="doctor-dashboard">
  <div id="app-shell">
    <div class="stat-grid" id="statGrid"></div>

    <div class="two-col">
      <div class="panel">
        <div class="panel-header">
          <div><h2>Today's Appointments</h2><p>Your schedule for today</p></div>
          <a class="btn btn-outline btn-sm" href="/doctor/appointments/index.html">View all</a>
        </div>
        <div class="panel-body no-pad" id="todayTable"></div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <div><h2>Upcoming Follow-ups</h2><p>Scheduled by you</p></div>
        </div>
        <div class="panel-body no-pad" id="followTable"></div>
      </div>
    </div>
  </div>

<script src="/js/mock-data.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/common.js"></script>
<script src="/doctor/page.js"></script>

</html>
