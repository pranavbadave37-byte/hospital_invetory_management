<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login · MediCore</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <a class="back-link" href="/login.html">← Back to workspace selection</a>
      <div class="logo-row">
        <div class="logo-mark">MC</div>
        <div>
          <strong style="display:block;font-size:15px;">MediCore</strong>
          <span style="font-size:11px;color:var(--color-text-muted);">Hospital Management System</span>
        </div>
      </div>
      <h1>Admin Login</h1>
      <p class="subtitle">Sign in to the Admin workspace</p>

      <div class="login-error" id="loginError"></div>

      <form id="loginForm">
        <div class="field" style="margin-bottom:14px;">
          <label>ID / Username</label>
          <input id="username" autocomplete="username" required />
        </div>
        <div class="field" style="margin-bottom:18px;">
          <label>Password</label>
          <input id="password" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Sign In</button>
      </form>
    </div>
  </div>

<script src="/js/mock-data.js"></script>
<script src="/js/auth.js"></script>
<script>
  const ROLE = "admin";
  const existing = MediCoreAuth.getSession();
  if (existing) {
    window.location.href = MediCoreAuth.homeFor(existing.role);
  }

  const errorBox = document.getElementById("loginError");
  document.getElementById("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const result = MediCoreAuth.login(username, password, ROLE);
    if (!result.ok) {
      errorBox.textContent = result.reason;
      errorBox.classList.add("show");
      return;
    }
    window.location.href = MediCoreAuth.homeFor(result.session.role);
  });
</script>
</body>
</html>
